services:
  - type: web
    name: ai-action-gateway-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-action-gateway-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: guardrailed-ai-gateway
      - key: JWT_AUDIENCE
        value: guardrailed-ai-gateway-api
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: ai-action-gateway-db
    databaseName: gateway_db
    user: gateway_user
    plan: free
