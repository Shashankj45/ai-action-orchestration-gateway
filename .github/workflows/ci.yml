name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI & Pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SECRET_KEY: ci-testing-secret-key-32-chars-long-value-12345
      JWT_SECRET_KEY: ci-testing-jwt-secret-key-at-least-32-chars-long-secure-value
      DATABASE_URL: sqlite:///./test_gateway.db
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ALLOWED_HOSTS: "*"
      LLM_PROVIDER: openai
      LLM_API_KEY: placeholder-ci-key
      LLM_MODEL: gpt-4o-mini
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          pytest -v --durations=10

  frontend-tests-and-build:
    name: Frontend Test & Build (React 18 & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build
